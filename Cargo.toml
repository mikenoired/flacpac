[package]
name = "flacpac-rusty"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["font-kit", "wayland", "x11"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.22"
notify = "8"
rfd = "0.15"
rusqlite = { version = "0.38", features = ["bundled"] }
rand = "0.9"
rodio = { version = "0.21.1", features = ["symphonia-aiff", "symphonia-alac"] }
souvlaki = "0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
gpui = { package = "gpui-ce", version = "=0.2.2", features = ["test-support"] }
