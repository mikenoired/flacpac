name: macOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release artifact
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          app="Flacpac.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/flacpac-rusty "$app/Contents/MacOS/flacpac-rusty"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>flacpac-rusty</string>
            <key>CFBundleIdentifier</key><string>com.mikenoired.flacpac</string>
            <key>CFBundleName</key><string>Flacpac</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
          </dict>
          </plist>
          PLIST
          cp README.md Flacpac-README.md
          archive="flacpac-${VERSION}-macos-${ARCH}.zip"
          zip -qr "$archive" "$app" Flacpac-README.md
          shasum -a 256 "$archive" > "${archive}.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            flacpac-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip
            flacpac-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: macos-15
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: macos-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --title "Flacpac $TAG" \
            --generate-notes \
            --notes "macOS app bundles are unsigned and are not notarized. Gatekeeper may block the app until the user allows it in System Settings."
